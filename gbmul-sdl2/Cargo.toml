[package]
name = "gbmul-sdl2"
version = "0.1.0"
edition = "2021"
description = "Native SDL2 frontend for the GBmul Game Boy emulator"
build = "build.rs"

[[bin]]
name = "gbmul-sdl2"
path = "src/main.rs"

[features]
sdl2 = ["dep:sdl2"]

[dependencies]
gbmul-core = { path = "../gbmul-core" }
sdl2 = { version = "0.37", features = ["bundled"], optional = true }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0" }
bincode = "1.3"
chrono = "0.4"

[build-dependencies]
chrono = "0.4"
