[package]
name = "gbmul-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the GBmul Game Boy emulator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gbmul-core = { path = "../gbmul-core" }

# Serialization (for save_state / load_state)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Logging
log = "0.4"

# WASM bindings
wasm-bindgen = "0.2"

# JavaScript / browser APIs
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
] }

# Random bytes (WASM-compatible, uses browser crypto.getRandomValues)
getrandom = { version = "0.2", features = ["js"] }

# Panic hook for better error messages in browser console
console_error_panic_hook = "0.1"

# Logging to browser console
console_log = "1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
