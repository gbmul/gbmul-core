[package]
name = "gbmul-core"
version = "0.1.0"
edition = "2021"
description = "Pure Game Boy emulator core (no platform dependencies)"

[dependencies]
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
log = "0.4"
getrandom = "0.2"
base64 = "0.22"

[features]
default = []
emulator_tests = []

[dev-dependencies]
base64 = "0.22"

[[bin]]
name = "fixture_meta"
path = "src/bin/fixture_meta.rs"
required-features = []

[[bin]]
name = "prove_piece_type"
path = "src/bin/prove_piece_type.rs"
required-features = []




